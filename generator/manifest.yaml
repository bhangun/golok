version: 1.0
name: akuh
templates:
- name: default_flutter
  framework: flutter
  subFramework: riverpod
  side: FRONTEND
  baseDir: riverpod
  templateItems:
  - name: app
    dataBinding: BLUEPRINT
    baseDir: app
  - name: entity
    dataBinding: ENTITIES
    baseDir: entity
    loop: true
    fileItems:
    - fromPath: entity.dart.ejs
      toPath: lib/features/{ENTITY_NAME}/model/{ENTITY_FILE}.dart
    - fromPath: entity.feature.dart.ejs
      toPath: lib/features/{ENTITY_NAME}/{ENTITY_FILE}_feature.dart
    - fromPath: entity.services.dart.ejs
      toPath: lib/features/{ENTITY_NAME}/services/{ENTITY_FILE}_services.dart
    - fromPath: entity.logic.dart.ejs
      toPath: lib/features/{ENTITY_NAME}/logic/{ENTITY_FILE}_logic.dart
    - fromPath: pages/entity.list.dart.ejs
      toPath: lib/features/{ENTITY_NAME}/pages/{ENTITY_FILE}_list.dart
    - fromPath: pages/entity.detail.dart.ejs
      toPath: lib/features/{ENTITY_NAME}/pages/{ENTITY_FILE}_detail.dart
    - fromPath: pages/entity.form.dart.ejs
      toPath: lib/features/{ENTITY_NAME}/pages/{ENTITY_FILE}_form.dart
  - name: enums
    dataBinding: ENUMS
    baseDir: entity
    fileItems:
    - fromPath: entity.enum.dart.ejs
      toPath: lib/features/enums/enums.dart